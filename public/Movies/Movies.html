<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The King of Movies</title>
    <link rel="stylesheet" href="MoviesStyles.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="MoviesScript.js"></script>
</head>
<body>
    <h1>The King of Movies</h1>
    <nav class="category-tabs">
        <a href="../Games/Games.html">Games</a>
        <a href="../Movies/Movies.html" class="active">Movies</a>
        <a href="../Shows/Shows.html">Shows</a>
        <a href="../Music/Music.html">Music</a>
    </nav>
    <fieldset id="yearlyArchive">
        <legend>Yearly Top 10</legend>
        <div id="archiveList"></div>
    </fieldset>
    <input type="text" id="searchInput" placeholder="Search for names..." onkeyup="searchFunction()">
    <button class="addMovie" onclick="showAddWindow()">Add Movie</button>
    <fieldset id="movieItemField">
    <table id="itemTable">
        <tr>
            <th class="tableHead">Rank</th>
            <th class="tableHead">Cover</th>
            <th class="tableHead">Name</th>
            <th class="tableHead">Producer</th>
            <th class="tableHead">Rating</th>
        </tr>
    </table>
    </fieldset>
    <div id="overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); justify-content:center; align-items:center;">
        <div style="background:white; padding:20px; border-radius:5px;">
            <h2>Add Entry</h2>
            <input type="file" id="coverInput" accept="image/*">
            <input type="text" id="nameInput" placeholder="Name">
            <input type="text" id="creatorInput" placeholder="Producer">
            <br>
            <button onclick="addEntry()">Submit</button>
            <button onclick="hideAddWindow()">Cancel</button>
        </div>
    </div>
    <script>
        function searchFunction() {
            var input = document.getElementById('searchInput').value.toUpperCase();
            var table = document.getElementById('itemTable');
            var tr = table.getElementsByTagName('tr');
            for (var i = 1; i < tr.length; i++) {
                var name = tr[i].getElementsByTagName('td')[2];
                var creator = tr[i].getElementsByTagName('td')[3];
                if (name && creator) {
                    var nameText = name.textContent || name.innerText;
                    var creatorText = creator.textContent || creator.innerText;
                    if (nameText.toUpperCase().indexOf(input) > -1 || creatorText.toUpperCase().indexOf(input) > -1) { tr[i].style.display = ''; } else { tr[i].style.display = 'none'; }
                }
            }
        }
        function showAddWindow() { document.getElementById('overlay').style.display = 'flex'; }
        function hideAddWindow() { document.getElementById('overlay').style.display = 'none'; }
        function addEntry() {
            var cover = document.getElementById('coverInput').files[0];
            var name = document.getElementById('nameInput').value.trim();
            var creator = document.getElementById('creatorInput').value.trim();
            if (!cover || !name || !creator) { alert('Please fill in all fields.'); return; }
            var reader = new FileReader();
            reader.onload = async function () {
                var imageData = reader.result;
                try {
                    var res = await fetch('/api/items/movies', {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name: name, creator: creator, cover: imageData })
                    });
                    var data = await res.json();
                    if (!res.ok) { alert(data.error || 'Failed to add'); return; }
                    document.getElementById('coverInput').value = '';
                    document.getElementById('nameInput').value = '';
                    document.getElementById('creatorInput').value = '';
                    hideAddWindow();
                    loadItems();
                } catch (e) { alert('Error: ' + e.message); }
            };
            reader.readAsDataURL(cover);
        }
    </script>
<footer>2026</footer>
</body>
</html>
